[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ethnocoder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.106.0,<2",
    "pycldf>=2.1.1,<3",
    "pymupdf>=2.0,<3",
    "rich>=15.0.0,<16",
    "tqdm>=4.70.1,<5",
    "pandas>=3.1.1,<4",
    "lxml>=6.1.3,<7",
    "matplotlib>=3.11.2,<4",
]

[project.scripts]
ethnocoder = "ethnocoder.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ethnocoder"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
